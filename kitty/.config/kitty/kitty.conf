font_family family="NotoSansM Nerd Font Mono"

mouse_hide_wait	-1.0
cursor_trail 1
custom_shaders cursor-trail-motion-blur

include themes/crack.conf

tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
active_tab_foreground #e0e0e0
active_tab_background #000000
inactive_tab_foreground #777777
inactive_tab_background #000000
active_tab_font_style bold

confirm_os_window_close 0

macos_show_window_title_in none
hide_window_decorations titlebar-only
window_padding_width 4 4 4 4

enabled_layouts splits,stack

allow_remote_control yes

clear_all_shortcuts yes

# Jump forward/backward one word with Option + Arrow
map alt+left send_text all \x1b\x62
map alt+right send_text all \x1b\x66

# Jump to start/end of line with Command + Arrow
map super+left send_text all \x01
map super+right send_text all \x05

map ctrl+s>shift+r load_config_file
# Ctrl+S, then Shift+T: rename the active tab
map ctrl+s>shift+t kitten workspace_tab_rename.py

map ctrl+s>h neighboring_window left
map ctrl+s>j neighboring_window down
map ctrl+s>k neighboring_window up
map ctrl+s>l neighboring_window right

map ctrl+s>v kitten new_window.py vsplit
map ctrl+s>n kitten new_window.py hsplit
map ctrl+s>x close_window
map ctrl+s>z toggle_layout stack

map --allow-fallback=shifted,ascii cmd+c copy_or_noop
map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard

map cmd+q quit
map cmd+n kitten new_workspace_window.py
map cmd+t kitten new_window.py
map cmd+w kitten window_kill.py
map cmd+shift+w kitten close_workspace_window.py
map cmd+k launch --type=tab --tab-title=workspaces /opt/homebrew/bin/kitten /Users/suk/.config/kitty/workspace_picker.py --command select --anchor @active-kitty-window-id

# Switch between tabs
map ctrl+s>. next_tab
map ctrl+s>, previous_tab

# Workspaces (zmx-backed). See workspaces/DESIGN.md.
# cmd+n new workspace window (picker); cmd+t new tab; ctrl+s v/n splits; cmd+w kills the window (zmx session ends);
# ctrl+s x detaches (zmx keeps running, reattach from the picker's d menu);
# cmd+shift+w closes this workspace's windows in this OS window (detached, not killed);
# cmd+k opens/switches a workspace; ctrl+s w r renames.
# Opt-in startup restore: uncomment to reopen last session's workspaces at launch.
# startup_session ~/.config/kitty/workspaces/startup.session
watcher workspace_watcher.py
map ctrl+s>w>r kitten workspace_rename.py
map ctrl+s>shift+x kitten window_kill.py

# Command palette (ctrl+shift+f3): workspace commands, pinned at the top when the search is empty.
# Each alias is a kitty action with its arguments, so the palette can run our kittens directly.
action_alias ws_menu launch --type=tab --tab-title=workspaces /opt/homebrew/bin/kitten /Users/suk/.config/kitty/workspace_picker.py --anchor @active-kitty-window-id
action_alias ws_open_workspace launch --type=tab --tab-title=workspaces /opt/homebrew/bin/kitten /Users/suk/.config/kitty/workspace_picker.py --command select --anchor @active-kitty-window-id
action_alias ws_detached_windows launch --type=tab --tab-title=detached /opt/homebrew/bin/kitten /Users/suk/.config/kitty/workspace_picker.py --command detached --anchor @active-kitty-window-id
action_alias ws_kill_workspace launch --type=tab --tab-title=kill /opt/homebrew/bin/kitten /Users/suk/.config/kitty/workspace_picker.py --command kill_workspace --anchor @active-kitty-window-id
action_alias ws_new_workspace kitten new_workspace_window.py
action_alias ws_new_tab kitten new_window.py tab
action_alias ws_new_vsplit kitten new_window.py vsplit
action_alias ws_new_hsplit kitten new_window.py hsplit
action_alias ws_close_workspace_window kitten close_workspace_window.py
action_alias ws_kill_window kitten window_kill.py
action_alias ws_rename kitten workspace_rename.py
action_alias ws_rename_tab kitten workspace_tab_rename.py

map --new-mode resize ctrl+s>r
map --mode resize h resize_window narrower
map --mode resize l resize_window wider
map --mode resize j resize_window shorter
map --mode resize k resize_window taller
map --mode resize q pop_keyboard_mode
map --mode resize ctrl+c pop_keyboard_mode
