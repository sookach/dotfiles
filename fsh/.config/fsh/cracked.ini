; cracked monochrome high-contrast command-line theme for fast-syntax-highlighting

[base]
default = #f0f0f0
unknown-token = #ffffff,bold,underline
commandseparator = #808080
redirection = #909090
here-string-tri = #909090
here-string-text = bg:#1a1a1a
here-string-var = #ffffff,bg:#1a1a1a
exec-descriptor = #d0d0d0,bold
comment = #585858
correct-subtle = #e0e0e0
incorrect-subtle = #ffffff,underline
subtle-separator = #808080
subtle-bg = bg:#141414
secondary = free
recursive-base = #f0f0f0

[command-point]
reserved-word = #ffffff,bold
subcommand-word = #ffffff,bold
alias = #ffffff,bold
suffix-alias = #ffffff,bold
global-alias = #ffffff,bold
builtin = #ffffff,bold
function = #ffffff,bold
command = #ffffff,bold
precommand = #ffffff,bold
hashed-command = #ffffff,bold
single-sq-bracket = #909090,bold
double-sq-bracket = #909090,bold
double-paren = #909090,bold

[paths]
path = #e0e0e0
pathseparator = #808080
path-to-dir = #e0e0e0,underline
globbing = #ffffff,bold
globbing-ext = #d0d0d0

[bracket]
paired-bracket = bg:#2a2a2a
bracket-level-1 = #ffffff,bold
bracket-level-2 = #d0d0d0
bracket-level-3 = #989898

[arguments]
single-hypen-option = #909090
double-hypen-option = #909090
back-quoted-argument = #e0e0e0
single-quoted-argument = #d0d0d0
double-quoted-argument = #d0d0d0
optarg-string = #d0d0d0
optarg-number = #f0f0f0

[in-string]
back-dollar-quoted-argument = #ffffff,bold
back-or-dollar-double-quoted-argument = #ffffff,bold

[other]
variable = #e0e0e0
assign = #f0f0f0
assign-array-bracket = #909090
history-expansion = #ffffff,bold

[math]
mathvar = #e0e0e0,bold
mathnum = #f0f0f0
matherr = #ffffff,bold,underline

[for-loop]
forvar = #f0f0f0
fornum = #f0f0f0
foroper = #909090
forsep = #808080

[case]
case-input = #e0e0e0
case-parentheses = #909090
case-condition = bg:#1a1a1a
